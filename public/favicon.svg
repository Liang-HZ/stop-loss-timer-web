<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#133b2e"/>
      <stop offset="50%" stop-color="#0a1f1a"/>
      <stop offset="100%" stop-color="#05100d"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="spark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Squircle -->
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>
  <rect x="6" y="6" width="500" height="500" rx="110" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="4"/>
  <!-- Orbital Arc & Core & Spark -->
  <g filter="url(#glow)">
    <path d="M 362,148 A 140,140 0 1 0 392,295" fill="none" stroke="url(#ring)" stroke-width="34" stroke-linecap="round"/>
    <circle cx="256" cy="256" r="42" fill="#34d399"/>
    <circle cx="360" cy="155" r="28" fill="url(#spark)"/>
  </g>
</svg>
